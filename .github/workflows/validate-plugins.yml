name: Validate plugins

on:
  push:
    paths:
      - ".cursor-plugin/**"
      - ".claude-plugin/**"
      - ".factory-plugin/**"
      - ".agents/**"
      - "**/.cursor-plugin/**"
      - "**/.claude-plugin/**"
      - "**/.factory-plugin/**"
      - "**/.codex-plugin/**"
      - "**/agents/**"
      - "**/droids/**"
      - "**/hooks/**"
      - "scripts/**"
      - "schemas/**"
  pull_request:
    paths:
      - ".cursor-plugin/**"
      - ".claude-plugin/**"
      - ".factory-plugin/**"
      - ".agents/**"
      - "**/.cursor-plugin/**"
      - "**/.claude-plugin/**"
      - "**/.factory-plugin/**"
      - "**/.codex-plugin/**"
      - "**/agents/**"
      - "**/droids/**"
      - "**/hooks/**"
      - "scripts/**"
      - "schemas/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Validate harness projections
        run: |
          node --test scripts/sync-harness-plugins.test.mjs
          node scripts/sync-harness-plugins.mjs --check
